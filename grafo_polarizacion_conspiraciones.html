const nodes = new vis.DataSet(nodesData);
const edges = new vis.DataSet(edgesData);

const container = document.getElementById('red');
const data = { nodes: nodes, edges: edges };
const options = {
  physics: {
    barnesHut: { gravitationalConstant: -9000, centralGravity: 0.2,
                   springLength: 190, springConstant: 0.02, damping: 0.85 },
    stabilization: { iterations: 250 }
  },
  interaction: { hover: true, tooltipDelay: 100 },
  nodes: { borderWidth: 2 },
};
const network = new vis.Network(container, data, options);

function grupoDe(id) {
  const n = nodes.get(id);
  return n ? n.group : null;
}

function nombreGrupo(grupo) {
  return grupo === 'A' ? "Comunidad de teorías conspirativas" : "Resto de usuarios";
}

network.on("click", function(params) {
  if (params.nodes.length === 0) {
    reiniciarVista();
    return;
  }
  const idClic = params.nodes[0];
  const grupo = grupoDe(idClic);
  const nombre = nombreGrupo(grupo);

  const nodosMismoGrupo = nodesData.filter(n => n.group === grupo).map(n => n.id);

  const nodesUpdate = nodesData.map(n => {
    const enGrupo = n.group === grupo;
    return {
      id: n.id,
      color: enGrupo
        ? { background: n.color.background, border: '#222222' }
        : { background: '#EDEDED', border: '#DDDDDD' },
      font: { color: enGrupo ? '#ffffff' : '#BBBBBB' }
    };
  });
  nodes.update(nodesUpdate);

  const edgesUpdate = edgesData.map(e => {
    const dentro = nodosMismoGrupo.includes(e.from) && nodosMismoGrupo.includes(e.to);
    return {
      id: e.id,
      color: dentro ? e.color : '#F2F2F2',
      width: dentro ? e.width : 1
    };
  });

function reiniciarVista() {
  nodes.update(nodesData);
  edges.update(edgesData);
  document.getElementById('panelClic').style.display = 'none';
  document.getElementById('reiniciar').style.display = 'none';
}
